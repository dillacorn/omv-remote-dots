# Optional LAN-only backend path for Pi-hole/Nginx.
# Obico already uses the `obico` network. Keep it explicitly while adding
# the persistent shared LAN backend network.

services:
  tailscale:
    networks:
      obico: {}
      local-webapps:
        aliases:
          - tailscale-obico

networks:
  local-webapps:
    external: true
    name: local-webapps
