server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name owncast.example-tailnet.ts.net;

    ssl_certificate     /etc/nginx/owncast-certs/owncast.example-tailnet.ts.net.crt;
    ssl_certificate_key /etc/nginx/owncast-certs/owncast.example-tailnet.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 0;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    send_timeout 3600;

    location / {
        set $local_backend "http://owncast-tailscale:8080";
        proxy_pass $local_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
    }
}
