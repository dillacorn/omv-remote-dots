server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vaultwarden.example-tailnet.ts.net;

    ssl_certificate     /etc/nginx/vaultwarden-certs/vaultwarden.example-tailnet.ts.net.crt;
    ssl_certificate_key /etc/nginx/vaultwarden-certs/vaultwarden.example-tailnet.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $local_backend "http://tailscale-vaultwarden:80";
        proxy_pass $local_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering off;
    }
}
