[profile]
name = Example Strict
description = Strict profile with security feeds and device tracker lists

[lists]
keys =
    proplus
    oisd
    tif
    dga30
    native_amazon
    native_apple
    native_huawei
    native_roku
    native_samsung
    native_winoffice
    native_xiaomi
extra_urls =

[allow]
domains =
    example-allowed.com

[deny]
domains =
    msmetrics.ws.sonos.com
    msmetrics-test.ws.sonos.com

tlds =
    zip

[clients]
# One entry per line: ADDRESS | optional label
# Tailscale client example:
# 100.64.0.50 | laptop
# Profile-aware proxy example:
# 172.30.53.101 | arachnidium-personal
entries =

[proxy]
# Optional profile-aware Arachnidium endpoint.
# Port is the host/browser proxy port. docker_ip is the fixed IP on pihole-proxy.
enabled = false
port =
docker_ip =
label =
