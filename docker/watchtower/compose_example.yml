# change file name to "compose.yml" in order to use
# command: mv compose_example.yml compose.yml

services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower

    # Whitelist: Actively update only these containers.
    # Default: check every 6 hours.
    command: --interval 21600 watchtower brave tailscale-brave app-flame tailscale-flame mumble-web nginx-mumbleweb freshrss tailscale-freshrss app-ntfy tailscale-ntfy hbbs hbbr vaultwarden nginx-vaultwarden jellyfin tailscale-jellyfin jellyseerr mariadb_jellyseerr tailscale-jellyseerr gluetun transmission mullvad-browser audiobookshelf tailscale-audiobookshelf app-dockge tailscale-dockge

    # Optional for servers that run 24/7: restrict automatic updates to 2:45 AM
    # in the timezone configured below, reducing the chance of interrupting active sessions.
    # Watchtower allows either --interval or --schedule, not both.
    # To enable this, comment out the command above and uncomment the command below.
    # command: --schedule "0 45 2 * * *" watchtower brave tailscale-brave app-flame tailscale-flame mumble-web nginx-mumbleweb freshrss tailscale-freshrss app-ntfy tailscale-ntfy hbbs hbbr vaultwarden nginx-vaultwarden jellyfin tailscale-jellyfin jellyseerr mariadb_jellyseerr tailscale-jellyseerr gluetun transmission mullvad-browser audiobookshelf tailscale-audiobookshelf app-dockge tailscale-dockge

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/New_York

      # Logging
      - WATCHTOWER_LOG_LEVEL=info

      # Email Notifications
      - WATCHTOWER_NOTIFICATIONS=email
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=redacted@gmx.com
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=redacted@proton.me
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=mail.gmx.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=587
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=redacted@gmx.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=redacted_password
      - WATCHTOWER_NOTIFICATION_EMAIL_SUBJECTTAG=docker-up

      - DOCKER_API_VERSION=1.44

    restart: always
